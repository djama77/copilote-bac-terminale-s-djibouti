name: Web smoke tests
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free tests
        run: node --test tests/*.test.cjs
