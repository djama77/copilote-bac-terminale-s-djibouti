name: Android APK (Copilote Bac)

on:
  push:
    branches: [main]
    paths:
      - 'android-web/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        env:
          VITE_TUTOR_API_URL: ${{ vars.TUTOR_API_URL }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Compile debug APK
        run: bash ./gradlew assembleDebug --no-daemon
        working-directory: android-web/android

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" > android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilote-bac-s-djibouti-apk
          path: |
            android-web/android/app/build/outputs/apk/debug/app-debug.apk
            android-web/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
