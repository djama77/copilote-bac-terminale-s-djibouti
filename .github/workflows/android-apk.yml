name: Personal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-personal-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build personal web app
        env:
          VITE_TUTOR_API_URL: ${{ vars.TUTOR_API_URL }}
          VITE_PERSONAL_APP_TOKEN: ${{ secrets.PERSONAL_APP_TOKEN }}
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Compile private debug APK
        run: bash ./gradlew assembleDebug --no-daemon
        working-directory: android-web/android

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload personal APK
        uses: actions/upload-artifact@v4
        with:
          name: copilote-bac-personnel-apk
          path: |
            android-web/android/app/build/outputs/apk/debug/app-debug.apk
            android-web/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
