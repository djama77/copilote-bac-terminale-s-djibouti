name: Android APK (Capacitor)

on:
  push:
    branches:
      - feature/android-capacitor-apk-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Compile debug APK
        run: bash ./gradlew assembleDebug --no-daemon
        working-directory: android-web/android
      - name: Verify APK and generate SHA-256 checksum
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: copilote-bac-s-djibouti-debug-apk
          path: |
            android-web/android/app/build/outputs/apk/debug/app-debug.apk
            android-web/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
